[package]
name = "liteparse"
version = "2.16.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fast, lightweight PDF and document parsing with spatial text extraction"
readme = "README.md"

[lib]
name = "liteparse"

[[bin]]
name = "lit"
path = "src/main.rs"

[features]
# Pure Rust by default: the hayro backend needs no native PDF library, and the
# built-in Tesseract engine (a C++ build) is opt-in.
default = []
oar-ocr = ["dep:oar-ocr"]
oar-ocr-auto-download = ["oar-ocr", "oar-ocr/auto-download"]
oar-ocr-cuda = ["oar-ocr", "oar-ocr/cuda"]
oar-ocr-tensorrt = ["oar-ocr", "oar-ocr/tensorrt"]
oar-ocr-directml = ["oar-ocr", "oar-ocr/directml"]
oar-ocr-coreml = ["oar-ocr", "oar-ocr/coreml"]
oar-ocr-webgpu = ["oar-ocr", "oar-ocr/webgpu"]
oar-ocr-openvino = ["oar-ocr", "oar-ocr/openvino"]
tesseract = ["dep:tesseract-rs"]

[dependencies]
base64 = "0.22"
blake3 = "1"
clap = { version = "4.5.55", features = ["derive"] }
file-format = { version = "0.29.0", features = ["reader"] }
image = { version = "0.25", default-features = false, features = ["default-formats"] }
memchr = "2"
ordered-float = "5.3.0"
# PDF backend. `crate::pdfium_compat` adapts hayro to the pdfium API the rest
# of the crate was written against.
hayro = { version = "0.8.0", features = ["embed-fonts", "embed-cmaps"] }
foldhash = "0.2"
unicode-bidi = "0.3.18"
unicode-bidi-mirroring = "0.3"
unicode-normalization = "0.1"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "form", "multipart", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2"
tesseract-rs = { version = "0.2", features = ["build-tesseract"], optional = true }
tokio = { version = "1.52.3", features = ["rt", "macros", "sync", "time", "io-util"] }
url = "2"
web-time = "1.1.0"
flate2 = "1.1.9"
resvg = "0.44"
usvg = "0.44"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { version = "0.45", default-features = false }
oar-ocr = { version = "0.8", optional = true }
rmp = "0.8"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "fs", "process"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
serial_test = "3"
crc32fast = "1"
regex = "1"
