[package]
name = "liteparse-napi"
version = "2.16.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node.js native bindings for LiteParse"

[lib]
crate-type = ["cdylib"]

[features]
default = ["tesseract"]
tesseract = ["liteparse/tesseract"]

[dependencies]
liteparse = { package = "liteparse", version = "2.16.0", path = "../liteparse", default-features = false }
napi = { version = "2", features = ["async", "serde-json", "napi9"] }
napi-derive = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
napi-build = "2"
